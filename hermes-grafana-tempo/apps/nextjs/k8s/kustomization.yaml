# nextjs-web manifests. Deployed with the other apps by `kubectl apply -k apps/`
# (apps/deploy-apps.sh), which rewrites the image `tempo-apps/nextjs` to the registry path.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tempo-apps
resources:
  - deployment.yaml
  - service.yaml
  - pdb.yaml
