# nextjs-web: Next.js front end. Calls nodejs-orders and exports traces (OTLP
# http/protobuf) to the OTel Collector. PSS "restricted" compliant.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextjs
  namespace: tempo-apps
  labels:
    app.kubernetes.io/name: nextjs
    app.kubernetes.io/part-of: tempo-apps
spec:
  replicas: 2                      # production default; the lab profile (apps/lab) sets 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0                # never drop below the desired count during a rollout
  selector:
    matchLabels:
      app.kubernetes.io/name: nextjs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nextjs
        app.kubernetes.io/part-of: tempo-apps
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      # Spread replicas over nodes (hard) and zones (best effort), counting only this revision.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: nextjs
          matchLabelKeys: ["pod-template-hash"]
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: nextjs
          matchLabelKeys: ["pod-template-hash"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nextjs
          image: tempo-apps/nextjs:1.0.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: DEPLOY_ENV               # -> deployment.environment.name; lab overlay sets "lab"
              value: production
            # Kubernetes sets HOSTNAME to the pod name; the standalone server binds to it.
            - name: HOSTNAME
              value: 0.0.0.0
            - name: ORDERS_URL
              value: http://nodejs:3000
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: STRESS_ENABLED           # stress endpoints for tests/; off by default
              value: "false"
            - name: STRESS_MAX_CPU_MS
              value: "5000"
            - name: STRESS_MAX_MB            # total MiB held at once, kept well under the memory limit
              value: "128"
            - name: STRESS_MAX_HOLD_S
              value: "30"
            - name: OTEL_SERVICE_NAME
              value: nextjs-web
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_TRACES_SAMPLER
              value: parentbased_always_on
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: deployment.environment.name=$(DEPLOY_ENV),service.namespace=tempo-apps,service.version=1.0.2,k8s.pod.name=$(POD_NAME)
          lifecycle:
            preStop:
              sleep:
                seconds: 5                 # let endpoints/Traefik stop routing before SIGTERM
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: next-cache
          emptyDir:
            sizeLimit: 128Mi
