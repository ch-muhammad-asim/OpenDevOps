# ClusterIP for nodejs-orders. Called by nextjs (http://nodejs:3000) and by Traefik.
apiVersion: v1
kind: Service
metadata:
  name: nodejs
  namespace: tempo-apps
  labels:
    app.kubernetes.io/name: nodejs
    app.kubernetes.io/part-of: tempo-apps
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nodejs
    app.kubernetes.io/part-of: tempo-apps
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
