# OPTIONAL overlay on values.yaml: trace blocks in a Google Cloud Storage bucket.
# Not used by the lab (the lab stores blocks in SeaweedFS S3 via values-s3.yaml); production uses
# helm/tempo-distributed.
# Chart grafana-community/tempo 3.2.1, Tempo 3.1.1. Use it together with values.yaml:
#   helm upgrade --install tempo grafana-community/tempo --version 3.2.1 \
#     --namespace observability --create-namespace \
#     -f helm/tempo/values.yaml -f helm/tempo/values-gcs.yaml \
#     --set tempo.storage.trace.gcs.bucket_name="$TEMPO_BUCKET"
#
# Auth: GKE Workload Identity Federation, no key files. infra/create-tempo-bucket.sh (wrapper around
# infra/create-gcs-bucket.sh) creates a dedicated bucket (uniform access, public access prevention,
# versioning off, 33-day lifecycle backstop) and grants roles/storage.objectUser for the Kubernetes
# ServiceAccount observability/tempo:
#   ACCESS_MODE=bucket (default)  on THIS bucket to the principal
#     principal://iam.googleapis.com/projects/<PROJECT_NUMBER>/locations/global/workloadIdentityPools/<PROJECT_ID>.svc.id.goog/subject/ns/observability/sa/tempo
#   ACCESS_MODE=conditional       project-level binding with an IAM condition limited to this bucket
#   ACCESS_MODE=gsa               a DEDICATED Google service account (never a default compute account)
#                                 that the KSA impersonates; scripts/deploy.sh adds the annotation.
# The WAL, live-store data and generator WAL stay on the PV from values.yaml.

serviceAccount:
  create: true
  name: tempo   # fixed name; the Workload Identity binding refers to observability/tempo
  # The GKE metadata server serves the token; the Kubernetes API token is still not mounted.
  automountServiceAccountToken: false

tempo:
  storage:
    trace:
      backend: gcs
      local: null      # drop the local block path from values.yaml
      gcs:
        bucket_name: ""  # required: set with --set tempo.storage.trace.gcs.bucket_name=<bucket>
      wal:
        path: /var/tempo/wal
