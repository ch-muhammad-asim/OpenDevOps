# Creates the buckets tempo-traces and thanos-metrics. Idempotent: lists the buckets first,
# creates only the missing ones, then fails unless both exist (the Job retries).
# Uses `weed shell` (same image) against the master; the shell then talks to the filer over
# gRPC. Needs no S3 credentials: bucket creation is a filer operation, so the per-bucket S3
# identities never need bucket-admin rights.
# Re-running: the Job is deleted 24h after it finishes; to run it again earlier (or after
# changing this file, Job specs are immutable):
#   kubectl -n object-storage delete job seaweedfs-bootstrap --ignore-not-found
#   kubectl apply -k helm/seaweedfs
apiVersion: batch/v1
kind: Job
metadata:
  name: seaweedfs-bootstrap
  namespace: object-storage
  labels:
    app.kubernetes.io/name: seaweedfs-bootstrap
    app.kubernetes.io/part-of: object-storage
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seaweedfs-bootstrap
        app.kubernetes.io/part-of: object-storage
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: chrislusf/seaweedfs:4.52@sha256:57877e32bb90073b37dc109b438ba66e84fd5ed9ced5f5c04f56444ef243ce59
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              HOST=seaweedfs-0.seaweedfs-headless.object-storage.svc
              MASTER="$HOST:9333"
              BUCKETS="tempo-traces thanos-metrics"
              echo "waiting for the master and the S3 gateway"
              i=0
              until curl -sf -o /dev/null "http://$MASTER/cluster/healthz" && \
                    curl -sf -o /dev/null "http://$HOST:8333/healthz"; do
                i=$((i+1)); [ "$i" -ge 60 ] && { echo "SeaweedFS not ready after 5 min"; exit 1; }
                sleep 5
              done
              list() { echo "s3.bucket.list" | /usr/bin/weed shell -master="$MASTER" 2>&1 | awk '{print $1}'; }
              existing=$(list)
              for b in $BUCKETS; do
                if printf '%s\n' "$existing" | grep -qx "$b"; then
                  echo "bucket $b already exists"
                else
                  echo "s3.bucket.create -name $b" | /usr/bin/weed shell -master="$MASTER"
                fi
              done
              final=$(list)
              for b in $BUCKETS; do
                printf '%s\n' "$final" | grep -qx "$b" || { echo "bucket $b missing"; exit 1; }
              done
              echo "buckets ready: $BUCKETS"
          env:
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
