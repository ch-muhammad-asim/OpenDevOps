# Lab profile for Thanos: the production base (../../base) with one replica each, small requests, no PDBs and
# smaller PVCs, sized for 3 x e2-standard-2. Object store: GCS via Workload Identity, as in production.
# Same Secret name and key as production (monitoring/thanos-objstore, objstore.yml), written by
# scripts/deploy.sh with "type: GCS" and the bucket name only (lab: thanos-metrics-<suffix>, THANOS_BUCKET);
# nothing here changes for the object store. Retention (30d raw / 5m / 1h) and downsampling stay as in production.
#   kubectl apply -k helm/thanos/overlays/lab
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - ../../base
patches:
  - path: query.yaml
  - path: store.yaml
  - path: compact.yaml
  # One replica each: a minAvailable=1 PDB would block every node drain.
  - patch: |-
      $patch: delete
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: thanos-query
  - patch: |-
      $patch: delete
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: thanos-store
  # Flag values that must shrink with the memory limits. Each "test" fails the build if the base
  # argument order changes, so a wrong flag is never replaced silently.
  - target:
      kind: Deployment
      name: thanos-query
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/args/11
        value: --query.max-concurrent=20
      - op: replace
        path: /spec/template/spec/containers/0/args/11
        value: --query.max-concurrent=4
  - target:
      kind: StatefulSet
      name: thanos-store
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/args/7
        value: --index-cache-size=512MB
      - op: replace
        path: /spec/template/spec/containers/0/args/7
        # 64MB cache needs an explicit max item size (default 125MiB is larger than the cache).
        value: "--index-cache.config={type: IN-MEMORY, config: {max_size: 64MB, max_item_size: 16MB}}"
      - op: test
        path: /spec/template/spec/containers/0/args/8
        value: --chunk-pool-size=1GB
      - op: replace
        path: /spec/template/spec/containers/0/args/8
        value: --chunk-pool-size=128MB
