# Fixed names: thanos-store and thanos-compact are the Workload Identity principals that get
# roles/storage.objectUser on the Thanos bucket (README "IAM"). thanos-query never touches the
# bucket. No component calls the Kubernetes API, so no token is mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: thanos-query
  labels:
    app.kubernetes.io/name: thanos-query
    app.kubernetes.io/part-of: thanos
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: thanos-store
  labels:
    app.kubernetes.io/name: thanos-store
    app.kubernetes.io/part-of: thanos
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: thanos-compact
  labels:
    app.kubernetes.io/name: thanos-compact
    app.kubernetes.io/part-of: thanos
automountServiceAccountToken: false
