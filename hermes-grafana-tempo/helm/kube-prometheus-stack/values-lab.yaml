# Lab overlay for kube-prometheus-stack 93.1.0: applied AFTER values.yaml when PROFILE=lab
#   helm upgrade --install prometheus prometheus-community/kube-prometheus-stack --version 93.1.0 -n monitoring \
#     -f helm/kube-prometheus-stack/values.yaml -f helm/kube-prometheus-stack/values-lab.yaml
# Target: 3 x e2-standard-2 in one zone (~5.8 vCPU / 17.6 GiB allocatable shared by everything).
# Only what differs from production: one replica each, no PDBs, a 40Gi PVC with an 8GiB cap, small
# requests (Prometheus and its Thanos sidecar), no alert receivers (and so no receivers Secret).
# Same as production: 2-day local TSDB + Thanos sidecar (30 days via helm/thanos/overlays/lab, object
# store = in-cluster SeaweedFS S3 through the same Secret monitoring/thanos-objstore), images/digests,
# selectors, remote-write receiver, exemplars, security contexts and the route tree.

prometheus:
  podDisruptionBudget:
    enabled: false               # one replica: a minAvailable=1 PDB would block node drains
  # Thanos sidecar on, as in production (values.yaml): the discovery Service and the sidecar
  # ServiceMonitor are restated here so the lab profile does not depend on the merge order.
  thanosService:
    enabled: true
  thanosServiceMonitor:
    enabled: true
  prometheusSpec:
    replicas: 1
    # Sidecar uploads each 2h block to bucket thanos-metrics on SeaweedFS S3. objstore.yml in the
    # Secret (written by scripts/deploy.sh, never in Git) is "type: S3" with endpoint
    # seaweedfs.object-storage:8333, insecure: true and the thanos S3 access key; image, version and
    # blockSize come from values.yaml. Only the requests are smaller.
    thanos:
      objectStorageConfig:
        existingSecret:
          name: thanos-objstore
          key: objstore.yml
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi
    # Local compaction off (min = max block duration = 2h), required by the sidecar; the Thanos
    # compactor compacts and downsamples in the bucket.
    disableCompaction: true
    # 2 days locally: a buffer for upload retries (ThanosSidecarNoRecentUpload fires after 6h); 30 days
    # of history are served by thanos-store. At the measured 3,429 samples/s, 2d is ~1-2 GB plus WAL.
    # The size cap deletes the oldest blocks first if uploads stall. The PVC stays 40Gi: a PVC cannot
    # shrink, so a smaller disk needs a new PVC (fresh install).
    retention: 2d
    retentionSize: 8GiB
    resources:
      requests:
        cpu: 300m
        memory: 1Gi
      limits:
        memory: 1536Mi
    storageSpec:
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              storage: 40Gi

alertmanager:
  podDisruptionBudget:
    enabled: false
  config:
    # Same route tree as production, receivers without integrations (alerts are visible in the
    # Alertmanager and Grafana UIs, nothing is sent out).
    receivers:
      - name: "null"
      - name: default
      - name: critical
  alertmanagerSpec:
    replicas: 1
    retention: 24h
    secrets: []                  # no receivers Secret in the lab
    storage: null                # emptyDir, as before (silences are lost on restart)
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  # config-reloader sidecar in the Prometheus and Alertmanager pods (measured ~1m CPU / ~11Mi
  # each in the lab): +10m / +32Mi requests in total.
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 5m
        memory: 16Mi
      limits:
        memory: 48Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi
