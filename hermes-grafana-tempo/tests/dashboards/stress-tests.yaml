# "Stress tests" Grafana dashboard, loaded by the Grafana sidecar (label grafana_dashboard).
# k6 RPS/latency/errors from the k6 OpenTelemetry output, per-pod CPU/throttling/memory/restarts/OOMKills
# for tempo-apps, Tempo span metrics and service graph, and Tempo trace tables + Explore links.
# Apply: kubectl apply -f tests/dashboards/stress-tests.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-stress-tests
  namespace: observability
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: tempo-tests
  annotations:
    grafana_folder: Tests
data:
  stress-tests.json: |-
    {
      "uid": "stress-tests",
      "title": "Stress tests",
      "tags": [
        "tempo-apps",
        "k6",
        "stress"
      ],
      "timezone": "utc",
      "schemaVersion": 41,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "editable": true,
      "links": [
        {
          "title": "Tempo: stress spans",
          "type": "link",
          "url": "/explore?left=%7B%22datasource%22%3A%20%22tempo%22%2C%20%22queries%22%3A%20%5B%7B%22refId%22%3A%20%22A%22%2C%20%22queryType%22%3A%20%22traceql%22%2C%20%22query%22%3A%20%22%7B%20name%20%3D~%20%5C%22stress.%2A%5C%22%20%7D%22%7D%5D%2C%20%22range%22%3A%20%7B%22from%22%3A%20%22now-1h%22%2C%20%22to%22%3A%20%22now%22%7D%7D",
          "targetBlank": true
        },
        {
          "title": "Tempo: slow server spans (>1s)",
          "type": "link",
          "url": "/explore?left=%7B%22datasource%22%3A%20%22tempo%22%2C%20%22queries%22%3A%20%5B%7B%22refId%22%3A%20%22A%22%2C%20%22queryType%22%3A%20%22traceql%22%2C%20%22query%22%3A%20%22%7B%20resource.service.namespace%20%3D%20%5C%22tempo-apps%5C%22%20%26%26%20kind%20%3D%20server%20%26%26%20duration%20%3E%201s%20%7D%22%7D%5D%2C%20%22range%22%3A%20%7B%22from%22%3A%20%22now-1h%22%2C%20%22to%22%3A%20%22now%22%7D%7D",
          "targetBlank": true
        },
        {
          "title": "Tempo: errors",
          "type": "link",
          "url": "/explore?left=%7B%22datasource%22%3A%20%22tempo%22%2C%20%22queries%22%3A%20%5B%7B%22refId%22%3A%20%22A%22%2C%20%22queryType%22%3A%20%22traceql%22%2C%20%22query%22%3A%20%22%7B%20resource.service.namespace%20%3D%20%5C%22tempo-apps%5C%22%20%26%26%20status%20%3D%20error%20%7D%22%7D%5D%2C%20%22range%22%3A%20%7B%22from%22%3A%20%22now-1h%22%2C%20%22to%22%3A%20%22now%22%7D%7D",
          "targetBlank": true
        }
      ],
      "templating": {
        "list": [
          {
            "name": "testid",
            "label": "k6 test",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values(k6_http_reqs_total, testid)",
              "refId": "q"
            },
            "definition": "label_values(k6_http_reqs_total, testid)",
            "includeAll": true,
            "multi": true,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "refresh": 2,
            "sort": 1
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "title": "k6 load (from the k6 OpenTelemetry output)",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "k6 requests per second",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 8,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (testid) (rate(k6_http_reqs_total{testid=~\"$testid\"}[$__rate_interval]))",
              "legendFormat": "{{testid}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "k6 p95 latency",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 8,
            "y": 1,
            "w": 8,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ms"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le, testid) (rate(k6_http_req_duration_milliseconds_bucket{testid=~\"$testid\"}[$__rate_interval])))",
              "legendFormat": "p95 {{testid}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "k6 error rate (non-2xx)",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 16,
            "y": 1,
            "w": 8,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (testid) (rate(k6_http_reqs_total{testid=~\"$testid\",status!~\"2..\"}[$__rate_interval])) / sum by (testid) (rate(k6_http_reqs_total{testid=~\"$testid\"}[$__rate_interval]))",
              "legendFormat": "{{testid}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "k6 virtual users",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 9,
            "w": 12,
            "h": 6
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (testid) (k6_vus{testid=~\"$testid\"})",
              "legendFormat": "{{testid}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "App server p95 latency (Tempo span metrics)",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 9,
            "w": 12,
            "h": 6
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le, service) (rate(traces_spanmetrics_latency_bucket{span_kind=\"SPAN_KIND_SERVER\",service=~\"nextjs-web|nodejs-orders|python-inventory\"}[$__rate_interval])))",
              "legendFormat": "{{service}}"
            }
          ]
        },
        {
          "type": "row",
          "title": "Pods in tempo-apps (cAdvisor + kube-state-metrics)",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 15,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "CPU used vs limit (cores)",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 8,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"tempo-apps\",container!=\"\",container!=\"POD\"}[$__rate_interval]))",
              "legendFormat": "{{pod}}"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (pod) (kube_pod_container_resource_limits{namespace=\"tempo-apps\",resource=\"cpu\"})",
              "legendFormat": "limit {{pod}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "CPU throttling (share of CFS periods throttled)",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 8,
            "y": 16,
            "w": 8,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (pod) (rate(container_cpu_cfs_throttled_periods_total{namespace=\"tempo-apps\",container!=\"\",container!=\"POD\"}[$__rate_interval])) / sum by (pod) (rate(container_cpu_cfs_periods_total{namespace=\"tempo-apps\",container!=\"\",container!=\"POD\"}[$__rate_interval]))",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Working-set memory vs limit",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 16,
            "y": 16,
            "w": 8,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"tempo-apps\",container!=\"\",container!=\"POD\"})",
              "legendFormat": "{{pod}}"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (pod) (kube_pod_container_resource_limits{namespace=\"tempo-apps\",resource=\"memory\"})",
              "legendFormat": "limit {{pod}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Restarts (increase over 5 min)",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 24,
            "w": 8,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (pod) (increase(kube_pod_container_status_restarts_total{namespace=\"tempo-apps\"}[5m]))",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "OOMKilled containers",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 8,
            "y": 24,
            "w": 8,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (pod) (kube_pod_container_status_terminated_reason{namespace=\"tempo-apps\",reason=\"OOMKilled\"}) or sum by (pod) (kube_pod_container_status_last_terminated_reason{namespace=\"tempo-apps\",reason=\"OOMKilled\"})",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Service graph: failed calls per second",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 16,
            "y": 24,
            "w": 8,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (client, server) (rate(traces_service_graph_request_failed_total[$__rate_interval]))",
              "legendFormat": "{{client}} \u2192 {{server}}"
            }
          ]
        },
        {
          "type": "row",
          "title": "Traces (Tempo)",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 32,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "type": "table",
          "title": "Stress spans (stress.cpu / stress.memory)",
          "datasource": {
            "type": "tempo",
            "uid": "tempo"
          },
          "gridPos": {
            "x": 0,
            "y": 33,
            "w": 12,
            "h": 9
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "tempo",
                "uid": "tempo"
              },
              "queryType": "traceql",
              "query": "{ name =~ \"stress.*\" }",
              "limit": 20,
              "tableType": "traces"
            }
          ]
        },
        {
          "type": "table",
          "title": "Error traces in the apps",
          "datasource": {
            "type": "tempo",
            "uid": "tempo"
          },
          "gridPos": {
            "x": 12,
            "y": 33,
            "w": 12,
            "h": 9
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "tempo",
                "uid": "tempo"
              },
              "queryType": "traceql",
              "query": "{ resource.service.namespace = \"tempo-apps\" && status = error }",
              "limit": 20,
              "tableType": "traces"
            }
          ]
        }
      ]
    }
