# Public route: https://hermes-gke.saqlainmushtaq.com -> hermes/hermes-dashboard:9119
#
# HTTPS is terminated by Cloudflare (proxied record, zone SSL mode "Full"). Cloudflare connects to
# Traefik's websecure entry point (:443), which serves Traefik's default certificate for this host;
# no cert-manager certificate is used. Access control: the Cloudflare-only allow list below, then
# Hermes's own dashboard login (Secret hermes-dashboard-auth). No extra proxy login layer.
# Middlewares live in this namespace because Traefik is configured with allowCrossNamespace=false.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: cloudflare-only
  namespace: hermes
spec:
  # Only Cloudflare's edge may connect (TCP source; Traefik keeps it with externalTrafficPolicy=Local).
  # Same list as k8s/ingressroutes.yaml (source: https://www.cloudflare.com/ips/).
  ipAllowList:
    sourceRange:
      - 173.245.48.0/20
      - 103.21.244.0/22
      - 103.22.200.0/22
      - 103.31.4.0/22
      - 141.101.64.0/18
      - 108.162.192.0/18
      - 190.93.240.0/20
      - 188.114.96.0/20
      - 197.234.240.0/22
      - 198.41.128.0/17
      - 162.158.0.0/15
      - 104.16.0.0/13
      - 104.24.0.0/14
      - 172.64.0.0/13
      - 131.0.72.0/22
      - 2400:cb00::/32
      - 2606:4700::/32
      - 2803:f800::/32
      - 2405:b500::/32
      - 2405:8100::/32
      - 2a06:98c0::/29
      - 2c0f:f248::/32
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: hermes
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    contentTypeNosniff: true
    frameDeny: true
    referrerPolicy: same-origin
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hermes-dashboard
  namespace: hermes
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Host(`hermes-gke.saqlainmushtaq.com`)
      middlewares:
        - name: cloudflare-only
        - name: security-headers
      services:
        - name: hermes-dashboard
          port: 9119
  tls: {}   # Traefik default certificate; Cloudflare (SSL "Full") provides the public certificate
