# Ingress for the read-only observability skill: only the Hermes gateway pod may reach the Thanos querier :10902
# (all PromQL, alerts, rules, targets; read API only), Tempo :3200 and Grafana :3000. Prometheus :9090 is
# deliberately not opened (it serves remote-write, /-/reload and /-/quit without auth). Additive allow rules next to the platform's default-deny policies in these
# namespaces (k8s/networkpolicies.yaml); they open nothing else. Read-only is enforced by the skill (query APIs
# only) and by Grafana's Viewer role.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: thanos-query-from-hermes
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: thanos-query
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: hermes
          podSelector:
            matchLabels:
              app.kubernetes.io/name: hermes-gateway
      ports:
        - {protocol: TCP, port: 10902}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tempo-from-hermes
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: tempo
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: hermes
          podSelector:
            matchLabels:
              app.kubernetes.io/name: hermes-gateway
      ports:
        - {protocol: TCP, port: 3200}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-from-hermes
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: grafana
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: hermes
          podSelector:
            matchLabels:
              app.kubernetes.io/name: hermes-gateway
      ports:
        - {protocol: TCP, port: 3000}
