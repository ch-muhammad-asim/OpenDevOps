# Egress allowlist proxy for herdr-hermes (internal network, not published).
Port 8888
Listen 0.0.0.0
Timeout 600
MaxClients 20
# Only herdr-hermes (Hermes model calls); the workbench (172.31.252.20) is refused.
Allow 172.31.252.10/32
DisableViaHeader Yes
# Only HTTPS tunnels, only to hosts listed in /etc/tinyproxy/allowlist (anchored extended regexes).
ConnectPort 443
FilterDefaultDeny Yes
FilterType ere
Filter "/etc/tinyproxy/allowlist"
LogLevel Connect
