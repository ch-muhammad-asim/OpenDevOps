# hermes-workbench: where Hermes's terminal/file tools and the work pane shells run (sshd :2222, user worker).
# No secrets of value, no internet (NetworkPolicy), no real herdr. Keys come from Secret hermes-workbench-keys:
# the init container installs them where the unchanged entrypoint expects them, with the modes sshd StrictModes needs.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: hermes-workbench-workspace, namespace: hermes-herdr}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: hermes-workbench, namespace: hermes-herdr}
spec:
  selector: {app.kubernetes.io/name: hermes-workbench}
  ports: [{name: ssh, port: 2222, targetPort: 2222}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: hermes-workbench, namespace: hermes-herdr, labels: {app.kubernetes.io/name: hermes-workbench}}
spec:
  replicas: 1
  strategy: {type: Recreate}           # RWO volume
  selector: {matchLabels: {app.kubernetes.io/name: hermes-workbench}}
  template:
    metadata: {labels: {app.kubernetes.io/name: hermes-workbench}}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch   # no recursive chown/chmod on every start (keeps 0600 sockets/keys as written)
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: install-keys
          image: hermes-workbench
          command: [sh, -euc]
          args:
            - |
              umask 077
              install -m 0600 /secret/ssh_host_ed25519_key /secret/ctl_ed25519 /state/
              umask 022
              install -m 0644 /secret/ssh_host_ed25519_key.pub /secret/ctl_ed25519.pub /state/
              mkdir -p /auth/keys /auth/panekeys /auth/ctlkeys
              chmod 0755 /auth/keys /auth/panekeys /auth/ctlkeys
              install -m 0644 /secret/keys_authorized_keys /auth/keys/authorized_keys
              install -m 0644 /secret/panekeys_authorized_keys /auth/panekeys/authorized_keys
              install -m 0644 /secret/broker_known_hosts /auth/panekeys/broker_known_hosts
              chmod 0644 /auth/keys/* /auth/panekeys/*
          securityContext: &csc
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities: {drop: [ALL]}
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {cpu: 100m, memory: 64Mi}}
          volumeMounts:
            - {name: secret, mountPath: /secret, readOnly: true}
            - {name: state, mountPath: /state}
            - {name: auth, mountPath: /auth}
      containers:
        - name: hermes-workbench
          image: hermes-workbench
          securityContext: *csc
          ports: [{name: ssh, containerPort: 2222}]
          readinessProbe: {tcpSocket: {port: 2222}, periodSeconds: 10}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: workspace, mountPath: /work/workspace}
            - {name: state, mountPath: /var/lib/workbench}
            - {name: auth, mountPath: /keys, subPath: keys, readOnly: true}
            - {name: auth, mountPath: /panekeys, subPath: panekeys, readOnly: true}
            - {name: auth, mountPath: /ctlkeys, subPath: ctlkeys}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: workspace
          persistentVolumeClaim: {claimName: hermes-workbench-workspace}
        - name: secret
          secret: {secretName: hermes-workbench-keys, defaultMode: 0440}   # group-readable: fsGroup 10000
        - {name: state, emptyDir: {medium: Memory, sizeLimit: 1Mi}}
        - {name: auth, emptyDir: {medium: Memory, sizeLimit: 1Mi}}
        - {name: tmp, emptyDir: {medium: Memory, sizeLimit: 256Mi}}
