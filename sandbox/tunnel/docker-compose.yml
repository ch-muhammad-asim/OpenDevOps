# Tunnel from Traefik into the Hermes sandbox (no published ports).
#
#   docker compose -f sandbox/tunnel/docker-compose.yml up -d --build
#
# Joins two networks:
#   openshell_default  to reach the OpenShell gateway (gateway:8080);
#   hermes_edge        private network shared only with Traefik.
name: hermes-tunnel

services:
  tunnel:
    build: .
    image: hermes-tunnel:0.1.6
    container_name: hermes-tunnel
    restart: unless-stopped
    # Optional overrides in a .env file next to this file (see .env.example
    # and ../ENVIRONMENT.md). The defaults match scripts/up.sh.
    environment:
      OPENSHELL_GATEWAY_ENDPOINT: http://gateway:8080
      SANDBOX_NAME: ${SANDBOX_NAME:-hermes}
      DASHBOARD_PORT: ${DASHBOARD_PORT:-9119}
      API_PORT: ${API_PORT:-8642}
      HEALTH_INTERVAL: ${HEALTH_INTERVAL:-15}
      # Listen only on the private Traefik network, not on openshell_default.
      BIND_ADDRESS: 172.31.250.10
    # Hardening: non-root image user, no Linux capabilities, no privilege
    # gain through setuid, read-only root filesystem, bounded resources.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    mem_limit: 128m
    pids_limit: 64
    tmpfs:
      - /tmp:mode=1777,size=16m
    networks:
      openshell: {}
      edge:
        ipv4_address: 172.31.250.10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  openshell:
    name: openshell_default
    external: true
  edge:
    name: hermes_edge
    ipam:
      config:
        - subnet: 172.31.250.0/24
