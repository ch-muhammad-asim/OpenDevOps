# OpenShell gateway configuration for the Hermes sandbox (Docker driver).
# Mounted read-only at /etc/openshell/gateway.toml by docker-compose.yml.

[openshell]
version = 2

[openshell.gateway]
# Loopback only. The Docker driver adds a listener on the bridge interface so
# sandbox supervisors can reach the gateway.
bind_address      = "127.0.0.1:8080"
health_bind_address = "127.0.0.1:8081"
log_level           = "info"
compute_driver      = "docker"
# Plaintext + unauthenticated user API: safe only because it is bound to
# loopback on a single-user host. Enable mTLS before exposing it anywhere.
disable_tls         = true

[openshell.gateway.auth]
allow_unauthenticated_users = true

# Written by the compose init service.
[openshell.gateway.gateway_jwt]
signing_key_path = "/var/lib/openshell/tls/jwt/signing.pem"
public_key_path  = "/var/lib/openshell/tls/jwt/public.pem"
kid_path         = "/var/lib/openshell/tls/jwt/kid"
gateway_id       = "openshell-docker"

[openshell.drivers.docker]
default_image         = "nvcr.io/nvidia/base/ubuntu:24.04"
# Pinned to the gateway version instead of :latest.
sandbox_runtime_image = "ghcr.io/nvidia/openshell/sandbox:0.1.6"
supervisor_image      = "ghcr.io/nvidia/openshell/supervisor:0.1.6"
image_pull_policy     = "if_not_present"
sandbox_label         = "openshell"
app_armor_profile     = "Unconfined"
# Needed only to attach the labelled `hermes-data` named volume, so Hermes
# state survives sandbox re-creation. Bind mounts stay disabled.
allow_driver_config   = true
