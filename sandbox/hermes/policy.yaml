# OpenShell sandbox policy for Hermes Agent v0.23.0.
#
# Filesystem, landlock and process take effect at sandbox creation.
# network_policies is live: change it with `openshell policy set`.
version: 1

filesystem_policy:
  # Adds the whole /sandbox workspace as read-write. Only /sandbox/hermes
  # (HERMES_HOME, the hermes-data volume) survives sandbox re-creation; the
  # volume can't be the workspace root itself, so the workdir stays /sandbox.
  include_workdir: true
  read_only:
    - /bin
    - /usr
    - /lib
    - /lib64
    - /etc
    - /proc
    - /dev/urandom
    - /var/log
    - /opt/hermes # Hermes code, bundled Python and the dashboard web build
    - /opt/hermes-sandbox # seed config.yaml copied by start-hermes
  read_write:
    - /tmp # XDG_RUNTIME_DIR=/tmp/hermes-runtime
    - /dev/null
    # The dashboard's Chat page runs Hermes in a pseudo-terminal. Without
    # these, chat fails with "pty start failed: out of pty devices".
    - /dev/ptmx
    - /dev/pts

landlock:
  # Fail closed: never start Hermes without the filesystem rules.
  compatibility: hard_requirement

process:
  # The image's `hermes` user.
  run_as_user: "10000"
  run_as_group: "10000"

# Deny-by-default egress: everything not listed here is blocked.
network_policies:
  # The OpenCode bridge (OpenAI-compatible, free models) published on the
  # gateway host. Only Hermes's bundled Python may call it, and only the
  # OpenAI chat/model routes.
  opencode_bridge:
    endpoints:
      - host: host.openshell.internal
        port: 18383
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: /v1/models }
          - allow: { method: POST, path: /v1/chat/completions }
          - allow: { method: GET, path: /health }
    binaries:
      - path: /opt/hermes/tools/python-3.14.9+20261021-linux-x64/bin/python3.14
