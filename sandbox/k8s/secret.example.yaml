# 🔐 PLACEHOLDER ONLY: never commit a real key; create the Secret with kubectl.
#
# This file documents the Secret's shape (name, namespace, key). It is NOT in
# kustomization.yaml on purpose: applying it would overwrite the real key with
# the placeholder below. Create or rotate the real Secret from stdin instead,
# so the key never lands in git, shell history or `ps` output:
#
#   read -rs NVIDIA_API_KEY            # paste nvapi-..., input hidden
#   printf '%s' "$NVIDIA_API_KEY" | kubectl create secret generic nvidia-api-key \
#     -n hermes --from-file=api-key=/dev/stdin --dry-run=client -o yaml \
#     | kubectl apply -f -
#   unset NVIDIA_API_KEY
#
# Consumers mount it as the read-only file /var/run/secrets/nvidia/api-key
# (see provider-bootstrap-job.yaml). Full guide: sandbox/KUBERNETES.md.
apiVersion: v1
kind: Secret
metadata:
  name: nvidia-api-key
  namespace: hermes
  labels:
    app.kubernetes.io/part-of: hermes-sandbox
type: Opaque
stringData:
  api-key: REPLACE_ME_never-commit-a-real-key
