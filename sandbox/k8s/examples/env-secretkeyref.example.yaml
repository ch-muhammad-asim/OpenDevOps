# ⚠️ LESS PREFERABLE: the key as an environment variable (secretKeyRef).
#
# Shown for completeness and for tools that only read NVIDIA_API_KEY from the
# environment. Prefer the read-only file mount (provider-bootstrap-job.yaml)
# because an env var:
#   - is inherited by every child process the container starts,
#   - shows up in env dumps, debug endpoints, crash reports and core files,
#   - is readable via /proc/<pid>/environ by anything running as the same uid,
#   - is fixed at container start: rotation needs `kubectl rollout restart`
#     (or deleting the pod), while a mounted file is refreshed by the kubelet.
# `kubectl describe pod` shows only the reference (secretKeyRef), not the
# value, but the value is still in the process environment.
#
# Not part of kustomization.yaml. Example use: a one-request check with
# sandbox/scripts/nvidia_bench.py, which reads NVIDIA_API_KEY_FILE or, as a
# fallback, NVIDIA_API_KEY. The script is supplied as a ConfigMap:
#   kubectl -n hermes create configmap nvidia-bench --from-file=sandbox/scripts/nvidia_bench.py
apiVersion: v1
kind: Pod
metadata:
  name: nvidia-key-check-env
  namespace: hermes
  labels:
    app.kubernetes.io/name: nvidia-key-check
    app.kubernetes.io/part-of: hermes-sandbox
    hermes.opendevops.io/nvidia-egress: "true"
spec:
  automountServiceAccountToken: false
  enableServiceLinks: false
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: check
      image: python:3.13.9-slim  # pin by digest in production
      command:
        - python3
        - /opt/bench/nvidia_bench.py
        - --models
        - meta/llama-3.1-8b-instruct
        - --requests
        - "1"
        - --out-dir
        - /tmp/bench
      env:
        - name: NVIDIA_API_KEY
          valueFrom:
            secretKeyRef:
              name: nvidia-api-key
              key: api-key
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests: { cpu: 50m, memory: 64Mi }
        limits: { cpu: 500m, memory: 256Mi }
      volumeMounts:
        - name: bench
          mountPath: /opt/bench
          readOnly: true
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: bench
      configMap:
        name: nvidia-bench
    - name: tmp
      emptyDir:
        sizeLimit: 16Mi
