name: docker-agent image

on:
  push:
    branches: [main]
    paths:
      - docker-agent/**
      - "!docker-agent/**/*.md"
      - .github/workflows/docker-agent.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-agent-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: docker.io/quickbooks2018/opendevops-agent-runtime
  DOCKERHUB_USERNAME: quickbooks2018

jobs:
  # Trivy on the SOURCE (before any image is built): secrets anywhere in docker-agent/, and misconfigurations in the
  # Dockerfiles, Kubernetes manifests and Compose files. k8s-lab/demo-broken.yaml is skipped in the gate only: it is the
  # deliberately broken, unhardened demo workload. MEDIUM/LOW findings are reported, HIGH/CRITICAL or any secret fails.
  repo-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Trivy repo report (secrets + misconfigurations, all severities)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: docker-agent
          scanners: secret,misconfig
          format: table

      - name: Fail on any secret (all severities)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: docker-agent
          scanners: secret
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "1"
          skip-setup-trivy: true

      - name: Fail on HIGH/CRITICAL misconfigurations
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: docker-agent
          scanners: misconfig
          severity: HIGH,CRITICAL
          skip-files: docker-agent/k8s-lab/demo-broken.yaml
          exit-code: "1"
          skip-setup-trivy: true

  build:
    needs: repo-scan                  # nothing is built or pushed if the repo scan fails
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Model-provider backend (OpenAI by default, Docker Model Runner via --flavor local)
          - variant: default
            dockerfile: Dockerfile
            tag_prefix: ""
            latest_tag: latest
            smoke_env: -e OPENAI_API_KEY=dummy
          # Claude Code CLI harness backend
          - variant: claude-code
            dockerfile: Dockerfile.claude-code
            tag_prefix: claude-code-
            latest_tag: claude-code
            smoke_env: ""
          # Claude Code CLI bridge, the sidecar for the in-cluster SRE agent
          - variant: claude-code-cli-bridge
            dockerfile: claude-code-cli-bridge/Dockerfile
            tag_prefix: bridge-
            latest_tag: bridge
            smoke_env: ""
          # OpenCode CLI bridge (free OpenCode models, text-only)
          - variant: opencode-cli-bridge
            dockerfile: opencode-cli-bridge/Dockerfile
            tag_prefix: opencode-bridge-
            latest_tag: opencode-bridge
            smoke_env: ""
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build for smoke test
        uses: docker/build-push-action@v7
        with:
          context: docker-agent
          file: docker-agent/${{ matrix.dockerfile }}
          load: true
          tags: oda-runtime:ci

      - name: Smoke test (auth and API, no model calls)
        if: matrix.variant != 'claude-code-cli-bridge' && matrix.variant != 'opencode-cli-bridge'
        run: |
          docker run --rm oda-runtime:ci version
          if docker run --rm oda-runtime:ci; then
            echo "server started without AGENT_API_KEY"; exit 1
          fi
          KEY=$(openssl rand -hex 24)
          # Dummy provider key where needed: the server needs one to start, but no model is called here
          docker run -d --name smoke -p 8083:8083 -e AGENT_API_KEY="$KEY" ${{ matrix.smoke_env }} \
            --read-only --tmpfs /home/nonroot:uid=65532,gid=65532 --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges oda-runtime:ci
          for i in $(seq 1 15); do
            curl -s -o /dev/null http://localhost:8083/v1/models && break; sleep 1
          done
          docker logs smoke
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8083/v1/models)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer wrong' http://localhost:8083/v1/models)" = 401
          curl -sf -H "Authorization: Bearer $KEY" http://localhost:8083/v1/models | grep -q '"id":"root"'
          docker rm -f smoke

      - name: Smoke test bridge flavors (config only, bridges are not reachable from CI)
        if: matrix.variant == 'default'
        run: |
          KEY=$(openssl rand -hex 24)
          for flavor in claude-bridge codex-bridge opencode opencode-deepseek; do
            docker run -d --name "smoke-$flavor" -p 8083:8083 -e AGENT_API_KEY="$KEY" -e CLAUDE_BRIDGE_API_KEY=dummy -e OPENCODE_BRIDGE_API_KEY=dummy \
              --read-only --tmpfs /home/nonroot:uid=65532,gid=65532 --tmpfs /tmp \
              --cap-drop ALL --security-opt no-new-privileges oda-runtime:ci \
              serve chat /app/agent.yaml --listen 0.0.0.0:8083 --api-key-env AGENT_API_KEY --safety strict --flavor "$flavor"
            for i in $(seq 1 15); do
              curl -s -o /dev/null http://localhost:8083/v1/models && break; sleep 1
            done
            docker logs "smoke-$flavor"
            curl -sf -H "Authorization: Bearer $KEY" http://localhost:8083/v1/models | grep -q '"id":"root"'
            docker rm -f "smoke-$flavor"
          done

      - name: Smoke test SRE agent (tool binaries and config load, no cluster, no model calls)
        if: matrix.variant == 'default'
        run: |
          docker run --rm --entrypoint /usr/local/bin/kubernetes-mcp-server oda-runtime:ci --version
          KEY=$(openssl rand -hex 24)
          docker run -d --name smoke-sre -p 8083:8083 -e AGENT_API_KEY="$KEY" -e CLAUDE_BRIDGE_API_KEY=dummy \
            --read-only --tmpfs /home/nonroot:uid=65532,gid=65532 --tmpfs /tmp --tmpfs /data:uid=65532,gid=65532 \
            --cap-drop ALL --security-opt no-new-privileges oda-runtime:ci \
            serve chat /app/agent-sre.yaml --listen 0.0.0.0:8083 --api-key-env AGENT_API_KEY --safety restricted
          for i in $(seq 1 15); do
            curl -s -o /dev/null http://localhost:8083/v1/models && break; sleep 1
          done
          docker logs smoke-sre
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8083/v1/models)" = 401
          curl -sf -H "Authorization: Bearer $KEY" http://localhost:8083/v1/models | grep -q '"id":"root"'
          docker rm -f smoke-sre

      - name: Smoke test native API (serve api auth, no model calls)
        if: matrix.variant == 'default'
        run: |
          KEY=$(openssl rand -hex 24)
          trap 'docker rm -f smoke-api >/dev/null 2>&1 || true' EXIT
          docker run -d --name smoke-api -p 8080:8080 -e CLAUDE_BRIDGE_API_KEY=dummy \
            --read-only --tmpfs /home/nonroot:uid=65532,gid=65532 --tmpfs /tmp --tmpfs /data:uid=65532,gid=65532 \
            --cap-drop ALL --security-opt no-new-privileges oda-runtime:ci \
            serve api /app/agent-sre.yaml --listen 0.0.0.0:8080 --auth-token "$KEY" --session-db /data/sessions.db
          for i in $(seq 1 15); do
            curl -s -o /dev/null http://localhost:8080/health && break; sleep 1
          done
          docker logs smoke-api
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/health)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/agents)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer wrong' http://localhost:8080/api/agents)" = 401
          curl -sf -H "Authorization: Bearer $KEY" http://localhost:8080/api/agents | grep -q '"name":"agent-sre"'
          SID=$(curl -sf -H "Authorization: Bearer $KEY" -H 'Content-Type: application/json' -X POST http://localhost:8080/api/sessions -d '{}' | jq -r .id)
          test -n "$SID" && curl -sf -H "Authorization: Bearer $KEY" "http://localhost:8080/api/sessions/$SID" >/dev/null
          docker rm -f smoke-api

      - name: Smoke test Claude Code CLI bridge (no login, no model calls)
        if: matrix.variant == 'claude-code-cli-bridge'
        run: |
          docker run --rm --entrypoint /usr/local/bin/claude oda-runtime:ci --version
          KEY=$(openssl rand -hex 24)
          trap 'docker rm -f smoke-bridge >/dev/null 2>&1 || true' EXIT
          # bind 0.0.0.0 only here so the runner can reach it; in the Pod it stays on 127.0.0.1
          docker run -d --name smoke-bridge -p 18188:18188 -e CLAUDE_CODE_BRIDGE_API_KEY="$KEY" \
            --read-only --tmpfs /tmp --tmpfs /home/nonroot:uid=65532,gid=65532 \
            --cap-drop ALL --security-opt no-new-privileges oda-runtime:ci \
            --host 0.0.0.0 --port 18188 --model claude-haiku-4-5 --models claude-haiku-4-5 --effort low --cwd /home/nonroot
          for i in $(seq 1 20); do
            curl -s -o /dev/null http://localhost:18188/health && break; sleep 1
          done
          docker logs smoke-bridge
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:18188/health)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer wrong' http://localhost:18188/v1/models)" = 401
          curl -sf -H "Authorization: Bearer $KEY" http://localhost:18188/v1/models | grep -q '"claude-haiku-4-5"'
          # Only the models allowed by --models are accepted (rejected before any claude process starts)
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $KEY" -H 'Content-Type: application/json' \
            http://localhost:18188/v1/chat/completions -d '{"model":"claude-opus-5","messages":[{"role":"user","content":"x"}]}')" = 400
          # No Claude login in CI: the completion must fail with the CLI's login error, never return choices
          CODE=$(curl -s -m 90 -o out.json -w '%{http_code}' -H "Authorization: Bearer $KEY" -H 'Content-Type: application/json' \
            http://localhost:18188/v1/chat/completions \
            -d '{"model":"claude-haiku-4-5","messages":[{"role":"user","content":"ping"}]}')
          echo "HTTP $CODE: $(cat out.json)"
          test "$CODE" = 502
          jq -e '(.error.message | test("Not logged in")) and (has("choices") | not)' out.json >/dev/null
          # Refuses to start without its own API key
          if docker run --rm oda-runtime:ci --port 18189; then echo "bridge started without CLAUDE_CODE_BRIDGE_API_KEY"; exit 1; fi

      - name: Smoke test OpenCode CLI bridge (policy, auth, models; no model calls)
        if: matrix.variant == 'opencode-cli-bridge'
        run: |
          docker run --rm --entrypoint /usr/local/bin/opencode oda-runtime:ci --version
          # The baked policy: no shell, no writes, no web, no sub-agents, nothing outside the workspace
          docker run --rm --read-only --tmpfs /tmp --tmpfs /home/nonroot:uid=65532,gid=65532 \
            --entrypoint /usr/local/bin/opencode oda-runtime:ci debug config > policy.json
          jq -e '.permission as $p | ["bash","edit","write","patch","webfetch","websearch","task","skill","external_directory"]
                 | all(.[]; $p[.] == "deny")' policy.json >/dev/null
          jq -e '.permission | all(.[]; . == "allow" or . == "deny")' policy.json >/dev/null
          jq -e '[.permission | to_entries[] | select(.value == "allow") | .key] | sort == ["glob","grep","list","read","todowrite"]' policy.json >/dev/null
          jq -c '.permission' policy.json
          # Refuses to start without its own API key
          if docker run --rm oda-runtime:ci --port 18389; then echo "bridge started without OPENCODE_BRIDGE_API_KEY"; exit 1; fi
          KEY=$(openssl rand -hex 24)
          trap 'docker rm -f smoke-oc >/dev/null 2>&1 || true' EXIT
          docker run -d --name smoke-oc -p 18387:18387 -e OPENCODE_BRIDGE_API_KEY="$KEY" \
            --read-only --tmpfs /tmp --tmpfs /home/nonroot:uid=65532,gid=65532 --tmpfs /home/nonroot/workspace:uid=65532,gid=65532 \
            --cap-drop ALL --security-opt no-new-privileges oda-runtime:ci \
            --host 0.0.0.0 --port 18387 --model opencode/mimo-v2.6-flash-free --free-only \
            --cwd /home/nonroot/workspace --max-images 0
          for i in $(seq 1 150); do
            curl -s -o /dev/null http://localhost:18387/health && break; sleep 1
          done
          docker logs smoke-oc
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:18387/health)" = 401
          curl -sf -H "Authorization: Bearer $KEY" http://localhost:18387/v1/models | jq -e '[.data[].id] | index("opencode/mimo-v2.6-flash-free") != null' >/dev/null

      - name: Smoke test Claude Code harness (no login, no model calls)
        if: matrix.variant == 'claude-code'
        run: |
          docker run --rm --entrypoint claude oda-runtime:ci --version
          # Without credentials the harness must fail closed with an error, not hang or succeed
          KEY=$(openssl rand -hex 24)
          docker run -d --name smoke -p 8083:8083 -e AGENT_API_KEY="$KEY" \
            --read-only --tmpfs /home/nonroot:uid=65532,gid=65532 --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges oda-runtime:ci
          for i in $(seq 1 15); do
            curl -s -o /dev/null http://localhost:8083/v1/models && break; sleep 1
          done
          OUT=$(curl -s -m 90 -H "Authorization: Bearer $KEY" -H 'Content-Type: application/json' \
            http://localhost:8083/v1/chat/completions \
            -d '{"model":"root","messages":[{"role":"user","content":"ping"}]}' -w '\nHTTP %{http_code}')
          echo "$OUT"
          docker logs smoke 2>&1 | tail -20
          docker rm -f smoke
          echo "$OUT" | grep -q '^HTTP 500$'
          echo "$OUT" | grep -q 'harness claude-code failed'
          if echo "$OUT" | grep -q '"finish_reason":"stop"'; then echo "harness answered without login"; exit 1; fi

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: oda-runtime:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table

      - name: Fail on critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: oda-runtime:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ matrix.latest_tag }},enable={{is_default_branch}}
            type=sha,format=short,prefix=${{ matrix.tag_prefix }}sha-

      - uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB }}

      - name: Build and push multi-arch image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: docker-agent
          file: docker-agent/${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Published digest
        run: echo "${{ matrix.variant }} ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"

  # Authenticated end-to-end test of the published claude-code image (pulled, not built).
  # Runs only when a CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY repository secret exists.
  e2e-claude-code:
    needs: build
    runs-on: ubuntu-24.04
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Check for Claude credential
        id: cred
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No CLAUDE_CODE_OAUTH_TOKEN/ANTHROPIC_API_KEY secret; authenticated Claude Code E2E skipped (UNVERIFIED)"
            echo "Authenticated Claude Code E2E: **skipped, no credential secret (unverified)**" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Pull published image and run authenticated E2E
        if: steps.cred.outputs.present == 'true'
        run: |
          set -euo pipefail
          REF="${IMAGE}:claude-code-sha-${GITHUB_SHA::7}"
          docker pull -q "$REF"
          KEY=$(openssl rand -hex 24)
          CRED=()
          [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] && CRED+=(-e CLAUDE_CODE_OAUTH_TOKEN)
          [ -n "$ANTHROPIC_API_KEY" ] && CRED+=(-e ANTHROPIC_API_KEY)
          HARDEN=(--read-only --tmpfs /home/nonroot:uid=65532,gid=65532 --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges)

          # Unique non-secret sentinel, mounted read-only and readable by the container user
          SENTINEL="oda-sentinel-$(openssl rand -hex 12)"
          mkdir -p "$RUNNER_TEMP/sentinel" && echo "$SENTINEL" > "$RUNNER_TEMP/sentinel/sentinel.txt"
          chmod 755 "$RUNNER_TEMP/sentinel" && chmod 644 "$RUNNER_TEMP/sentinel/sentinel.txt"
          MOUNT=(-v "$RUNNER_TEMP/sentinel:/sentinel:ro")
          # Control: the file is readable by UID 65532, so a missing sentinel means denial, not a bad mount
          docker run --rm --user 65532:65532 "${MOUNT[@]}" busybox:1.37 cat /sentinel/sentinel.txt | grep -qx "$SENTINEL"

          docker run -d --name e2e -p 8083:8083 -e AGENT_API_KEY="$KEY" "${CRED[@]}" "${HARDEN[@]}" "${MOUNT[@]}" "$REF"
          for i in $(seq 1 15); do
            curl -s -o /dev/null http://localhost:8083/v1/models && break; sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8083/v1/models)" = 401

          # chat <prompt> <outfile>: asserts HTTP 200 and a well-formed, nonempty, completed reply
          chat() {
            CODE=$(curl -s -m 180 -o "$2" -w '%{http_code}' -H "Authorization: Bearer $KEY" \
              -H 'Content-Type: application/json' http://localhost:8083/v1/chat/completions \
              -d "$(jq -nc --arg c "$1" '{model:"root",messages:[{role:"user",content:$c}]}')")
            echo "HTTP $CODE: $(jq -c '{finish: .choices[0].finish_reason, content: .choices[0].message.content, error: .error.message}' "$2")"
            test "$CODE" = 200
            jq -e '.choices[0].finish_reason == "stop" and ((.choices[0].message.content // "") | gsub("\\s";"") | length > 0)' "$2" >/dev/null
          }

          echo "== positive: useful answer from Claude Code through docker-agent"
          chat "In one line: first kubectl command for a CrashLoopBackOff pod?" pos.json
          jq -r '.choices[0].message.content' pos.json | grep -qi kubectl

          echo "== negative: Read tool denied by managed settings (through docker-agent)"
          ASK="Use your Read tool on /sentinel/sentinel.txt and reply with its exact contents."
          chat "$ASK" neg.json
          if grep -q "$SENTINEL" neg.json; then echo "sentinel disclosed via docker-agent"; exit 1; fi

          echo "== denial evidence: same image, same harness flags, Claude Code stream-json"
          docker run --rm "${CRED[@]}" "${HARDEN[@]}" "${MOUNT[@]}" --entrypoint claude "$REF" \
            --print --verbose --dangerously-skip-permissions --output-format stream-json --model haiku \
            -p "$ASK" > stream.jsonl
          jq -c 'select(.type=="system" and .subtype=="init") | {tools}' stream.jsonl
          # Every built-in tool must be denied by managed settings: the init tool list has to be empty
          jq -e -s '[.[] | select(.type=="system" and .subtype=="init")][0].tools | length == 0' stream.jsonl >/dev/null
          jq -e -s '[.[] | select(.type=="result")][0].is_error == false' stream.jsonl >/dev/null
          if grep -q "$SENTINEL" stream.jsonl; then echo "sentinel disclosed via Claude Code"; exit 1; fi

          docker logs e2e 2>&1 | tail -5
          docker rm -f e2e
          echo "Authenticated Claude Code E2E: **passed** (positive answer, sentinel not disclosed, Claude Code tool list empty) for $REF" >> "$GITHUB_STEP_SUMMARY"
