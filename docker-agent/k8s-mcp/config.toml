# kubernetes-mcp-server for the SRE agent: read-only, core tools only, no Secrets.
# The kubeconfig (a read-only ServiceAccount token) is mounted at run time.
kubeconfig = "/kube/config"
cluster_provider_strategy = "kubeconfig"
read_only = true
# "config" is deliberately excluded: configuration_view would expose the kubeconfig token
toolsets = ["core"]
list_output = "table"
stateless = true
log_level = 0

[[denied_resources]]
group = ""
version = "v1"
kind = "Secret"
