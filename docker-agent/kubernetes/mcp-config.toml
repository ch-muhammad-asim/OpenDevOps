# kubernetes-mcp-server config for in-cluster use: the Pod's own (read-only) ServiceAccount token,
# no kubeconfig file. Same guardrails as ../k8s-mcp/config.toml: read_only, core tools only, Secrets denied.
# Rendered by kustomize's configMapGenerator: any change gets a new hashed name and rolls the Pod.
cluster_provider_strategy = "in-cluster"
read_only = true
toolsets = ["core"]
list_output = "table"
stateless = true
log_level = 0

[[denied_resources]]
group = ""
version = "v1"
kind = "Secret"
