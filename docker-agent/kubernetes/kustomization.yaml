apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: oda-system
resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
# Hashed name: changing mcp-config.toml creates a new ConfigMap and triggers a rollout
# (a subPath mount never picks up in-place ConfigMap edits)
configMapGenerator:
  - name: oda-agent-mcp
    files:
      - config.toml=mcp-config.toml
