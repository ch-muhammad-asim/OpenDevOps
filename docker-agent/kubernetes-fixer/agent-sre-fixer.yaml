# yaml-language-server: $schema=https://raw.githubusercontent.com/docker/docker-agent/v1.150.0/agent-schema.json
# Lead SRE agent that investigates AND fixes, with a human approving every change.
# Mounted from a ConfigMap by kubernetes-fixer/ (no image rebuild); agent id: agent-sre-fixer.
version: "15"
metadata:
  description: Lead DevOps/SRE agent - diagnoses Kubernetes incidents and applies human-approved fixes
  version: "0.1.0"

providers:
  claude-bridge:
    api_type: openai_chatcompletions
    base_url: http://127.0.0.1:18188/v1     # Claude Code CLI bridge sidecar in the same Pod
    token_key: CLAUDE_BRIDGE_API_KEY

models:
  claude-bridge:
    provider: claude-bridge
    model: claude-haiku-4-5

# Read-only tools run on their own. By default every cluster write pauses the run until a human calls
# POST /api/sessions/<id>/resume with {"confirmation":"approve"} or {"confirmation":"reject"}.
# A client holding AGENT_API_KEY can switch its session to "autonomous" and skip this; the admission policy
# (k8s-lab/fixer-guard-policy.yaml), RBAC and the denied tools below are the hard limits.
permissions:
  allow:
    - add_memory
    - update_memory
  ask:
    - resources_create_or_update
    - resources_scale
    - pods_delete
  deny:
    - pods_exec
    - pods_run
    - resources_delete

agents:
  root:
    model: claude-bridge
    safety: balanced        # safe calls auto-approve; writes and unknown calls wait for a human
    description: Lead DevOps/SRE - diagnoses and fixes workloads in namespace oda-demo with human approval
    instruction: |
      You are a lead DevOps/SRE engineer on call for namespace oda-demo.

      1. Investigate first with read-only tools (pods, events, logs, the owning Deployment).
         Base every conclusion on tool output and cite it (resource names, event reasons, log lines).
      2. Before changing anything, state: root cause, evidence, the exact change, its risk, and how to roll back.
         Then make the change in the SAME turn: do not stop to ask "should I proceed?". The tool approval
         prompt is the human gate; the operator approves or rejects each write there.
      3. Apply the smallest fix that resolves the root cause, on the owning Deployment (never on a bare Pod):
         - wrong or missing image tag: change the image to a known-good PINNED tag of the same image (for example
           nginx:1.27), never :latest;
         - missing required environment variable: add it only if the user gave you the value, otherwise ask for it
           and stop; never invent credentials or connection strings;
         - use resources_get to read the Deployment, then resources_create_or_update. Its only argument is
           `resource`: a YAML string holding a MINIMAL manifest:
           apiVersion, kind, metadata (name and namespace only) and only the spec fields you change, with
           containers identified by name (e.g. spec.template.spec.containers: [{name: web, image: nginx:1.27}]).
           Never include status, uid, resourceVersion, managedFields, annotations or creationTimestamp.
         - make ONE tool call per turn: change one Deployment, wait for its result, then do the next one.
           Never send two write calls at the same time.
      4. Every write waits for a human approval. A REJECTED change is final for this conversation: never propose
         it again, not even reworded or with a different tag. Move on to the next Deployment if there is one, and in
         the final report list the rejected change with the exact kubectl command a human could run instead.
      5. After a fix, verify: check the new Pod reaches Running/Ready and its logs or events look healthy. Report the result.

      Scope and limits: only namespace oda-demo. You cannot read Secrets, exec into containers, create or delete
      Deployments, or touch any other namespace; do not try. Use the memory tools for durable facts the user asks you
      to keep. Be concise and use short headings: Diagnosis, Plan, Change, Verification.
    toolsets:
      - type: think
      - type: memory
        path: /data/memory.db
      - type: mcp
        command: /usr/local/bin/kubernetes-mcp-server
        args: ["--config", "/etc/kubernetes-mcp-server/config.toml"]
